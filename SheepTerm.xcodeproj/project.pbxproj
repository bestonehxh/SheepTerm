		5EEB00000000000000000033 /* Bundle libssh */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Bundle libssh";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -e\nFW=\"${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}\"\nBIN=\"${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}\"\nmkdir -p \"$FW\"\n\n# The two dylibs this app carries, by exact soname. Not a glob on purpose: if\n# Homebrew moves libssh to a new major the binary still LINKS libssh.4, so\n# quietly copying libssh.5 would produce an app that cannot launch. Fail here,\n# saying which file moved and what has to change with it. Keep in step with\n# BUNDLED_LIBS in .ship.conf, which Tools/deps.sh and the release script read.\nneed() {  # need <path> <what to do about it>\n  [ -f \"$1\" ] || { echo \"error: $1 is missing. $2\" >&2; exit 1; }\n}\nneed /opt/homebrew/lib/libssh.4.dylib \"Run 'brew install libssh'. If Homebrew has moved to a new soname (libssh.5), this phase, the app's linked library and .ship.conf all have to be updated together.\"\nneed /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib \"Run 'brew install openssl@3'. A new OpenSSL major (libcrypto.4) needs this phase and .ship.conf updated together.\"\n\ncp -f /opt/homebrew/lib/libssh.4.dylib \"$FW/\"\ncp -f /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib \"$FW/\"\nchmod u+w \"$FW/libssh.4.dylib\" \"$FW/libcrypto.3.dylib\"\ninstall_name_tool -id @rpath/libssh.4.dylib \"$FW/libssh.4.dylib\" 2>/dev/null\ninstall_name_tool -id @rpath/libcrypto.3.dylib \"$FW/libcrypto.3.dylib\" 2>/dev/null\ninstall_name_tool -change /opt/homebrew/opt/openssl@3/lib/libcrypto.3.dylib @rpath/libcrypto.3.dylib \"$FW/libssh.4.dylib\" 2>/dev/null\nfixssh() {\n  for P in /opt/homebrew/lib/libssh.4.dylib /opt/homebrew/opt/libssh/lib/libssh.4.dylib; do\n    install_name_tool -change \"$P\" @rpath/libssh.4.dylib \"$1\" 2>/dev/null || true\n  done\n}\nfixssh \"$BIN\"\nDBG=\"${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/SheepTerm.debug.dylib\"\nif [ -f \"$DBG\" ]; then\n  fixssh \"$DBG\"\n  codesign --force --sign - \"$DBG\"\nfi\ncodesign --force --sign - \"$FW/libcrypto.3.dylib\" \"$FW/libssh.4.dylib\"\n\n# Every install_name_tool call above is allowed to fail quietly (they are\n# no-ops on a build that was already fixed up), so this is what actually\n# proves the job was done: an absolute Homebrew path left in any of the three\n# binaries is an app that runs on THIS Mac and cannot launch on one without\n# Homebrew — the failure that would otherwise be found by a user, not by us.\nLEAKS=\"\"\nfor F in \"$BIN\" \"$FW/libssh.4.dylib\" \"$FW/libcrypto.3.dylib\"; do\n  if otool -L \"$F\" | tail -n +2 | grep -q /opt/homebrew; then\n    LEAKS=\"$LEAKS $F\"\n  fi\ndone\nif [ -n \"$LEAKS\" ]; then\n  echo \"error: these still link an absolute Homebrew path and would not launch elsewhere:$LEAKS\" >&2\n  for F in $LEAKS; do otool -L \"$F\" | grep /opt/homebrew >&2; done\n  exit 1\nfi";
		};
/* End PBXShellScriptBuildPhase section */

